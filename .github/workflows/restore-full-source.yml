name: Restore Full ARAAK Industry Source

on:
  push:
    branches:
      - agent/restore-full-site
    paths:
      - '.restore/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout restore branch
        uses: actions/checkout@v4
        with:
          ref: agent/restore-full-site
          fetch-depth: 0

      - name: Reassemble source bundle
        shell: bash
        run: |
          cat .restore/part-* > /tmp/araak-source.b64
          base64 --decode /tmp/araak-source.b64 > /tmp/araak-source.tar.xz
          tar -tJf /tmp/araak-source.tar.xz >/dev/null

      - name: Restore exact full source
        shell: bash
        run: |
          rm -rf src public
          tar -xJf /tmp/araak-source.tar.xz -C .

      - name: Commit restored source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.restore'
          if git diff --cached --quiet; then
            echo "Source already restored."
            exit 0
          fi
          git commit -m "Restore full ARAAK Industry website"
          git push origin HEAD:agent/restore-full-site
