services:
  - type: web
    name: araak-industry
    runtime: node
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_PLATFORM_KEY
        sync: false
